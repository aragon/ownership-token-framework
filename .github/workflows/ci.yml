name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only reads the repo (checkout) and runs checks.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to full commit SHAs (supply-chain policy)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if the lockfile is out of sync, catching the
        # node_modules/lockfile drift that hid the router regression locally.
        run: pnpm install --frozen-lockfile

      # Decouple guard: the app vendors otf-cms's schemas/composer; fail if the
      # local copy drifts from the pinned upstream.
      - name: Vendored schema integrity
        run: node scripts/check-schema-drift.mjs

      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm type-check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
