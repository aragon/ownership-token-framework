onlyBuiltDependencies:
  - esbuild
  - lefthook
  - msw

# Supply-chain defense: refuse to install package versions published less than
# this many minutes ago (1440 = 24h). A version that is published maliciously
# and yanked within a day is therefore never resolved into the lockfile.
minimumReleaseAge: 1440

# Keep one router-core copy: @tanstack/react-start pins react-router (and so
# router-core) exactly, but router peers would otherwise float to newer cores.
overrides:
  "@tanstack/router-core": 1.171.35
